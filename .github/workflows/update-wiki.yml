name: Update GitHub Wiki

# ---------------------------------------------------------------------------
# SETUP (one-time, before this workflow can run successfully)
# ---------------------------------------------------------------------------
# 1. Create the wiki repo.
#    GitHub only initializes <repo>.wiki.git after at least one wiki page
#    has been created through the web UI (Repo -> Wiki tab -> "Create the
#    first page"). Do that once, manually, before the first run.
#
# 2. CLAUDE_CODE_OAUTH_TOKEN (subscription auth, no API key involved):
#      - Run `claude setup-token` locally (requires a Claude Pro/Max login).
#      - Copy the printed token.
#      - Repo Settings -> Secrets and variables -> Actions -> New repository
#        secret -> name it CLAUDE_CODE_OAUTH_TOKEN -> paste the value.
#
# 3. WIKI_SYNC_TOKEN (a classic GitHub PAT with `repo` scope):
#      - The default GITHUB_TOKEN cannot push to <repo>.wiki.git — wikis
#        are not covered by the `contents` permission grant. Fine-grained
#        PATs are not reliably supported for wiki access either.
#      - Create a PAT under Settings -> Developer settings -> Personal
#        access tokens (classic), then add it as secret WIKI_SYNC_TOKEN.
#
# 4. Adjust the `paths:` filter in wiki-sync-detect.yml (not in this file)
#    to match the folders in this repo that should actually drive
#    documentation updates. Keep both files' filters in sync.
#
# WHY THIS WORKFLOW TRIGGERS ON `workflow_run` INSTEAD OF `push`:
# anthropics/claude-code-action@v1 hard-rejects the `push` event
# (observed failure: "Unsupported event type: push") — it only accepts
# issue/PR/dispatch/schedule/workflow_run events. wiki-sync-detect.yml
# does the actual push-triggered path filtering; this workflow reacts to
# that workflow's completion, which IS an accepted event type.
# ---------------------------------------------------------------------------

on:
  workflow_run:
    workflows:
      - "Wiki Sync - Detect Changes"
    types:
      - completed

# contents: read is enough — the wiki push uses WIKI_SYNC_TOKEN, not
# GITHUB_TOKEN, and this workflow never modifies the main repo.
permissions:
  contents: read

concurrency:
  group: update-wiki-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  update-wiki:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo at triggering commit
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Checkout wiki repo
        run: |
          git clone "https://x-access-token:${WIKI_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}

      - name: Compute scoped diff
        id: diff
        working-directory: repo
        run: |
          # fetch-depth: 2 above guarantees HEAD~1 exists. This diffs the
          # single triggering commit; if a push lands multiple commits at
          # once, only the last one is captured here — widen fetch-depth
          # and this range if that matters for your workflow.
          git diff HEAD~1 HEAD -- src docs README.md > ../wiki-sync.diff || true

          if [ ! -s ../wiki-sync.diff ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code to update wiki pages
        if: steps.diff.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            A change was just merged to main in this repository. The full
            diff of the relevant files (src/**, docs/**, README.md only) is
            saved at ./wiki-sync.diff — read that file for context, do not
            review the rest of the repo.

            The GitHub wiki is checked out at ./wiki. Update only the wiki
            pages that are actually affected by this diff (e.g. reflect a
            renamed function, a new config option, a changed CLI flag). Do
            not touch unrelated pages, do not reformat pages you aren't
            updating, and do not create new pages unless the diff introduces
            something with no existing wiki coverage at all.

            If nothing in the diff warrants a wiki update, make no changes.
          claude_args: |
            --max-turns 12
            --allowedTools "Read,Edit,Write"

      - name: Commit and push wiki changes
        if: steps.diff.outputs.changed == 'true'
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Claude made no wiki changes for this diff."
          else
            git commit -m "Auto-update wiki for ${{ github.event.workflow_run.head_sha }}"
            git push
          fi
